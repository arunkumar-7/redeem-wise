services:

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery-service

  card-service:
    build: ./card-service
    container_name: card-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - discovery-service

  reward-service:
    build: ./reward-service
    container_name: reward-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - discovery-service

  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service